# Control Loop Simulation — runtime configuration
# All temperatures are Kelvin. See docs/control-loop-architecture.md §3.1 for unit rationale.

simulation:
  dt_seconds: 0.5          # fixed simulated timestep, decoupled from UI refresh rate
  model_type: first_order   # looked up in engine/models' MODEL_REGISTRY

model_params:
  first_order:
    thermal_mass: 5.0        # J/K
    loss_coeff: 0.3          # W/K
    k_heat: 1.0               # W per % heater output
    t_ambient: 293.15         # K (20 C)
    t_initial: 293.15         # K, starting plant temperature

setpoint:
  default_k: 323.15  # K (50 C)

# Used starting Phase 4 (interlock bounds/rate-limit checks)
interlock:
  t_min_k: 273.15           # K (0 C) — hard floor
  t_max_k: 373.15           # K (100 C) — hard ceiling
  bound_margin_k: 5.0        # reject commands pushing further toward a bound within this margin
  max_delta_per_tick_pct: 10.0  # slew limit on heater_output_pct

# Used starting Phase 2 (PID controller)
pid:
  kp: 2.0
  ki: 0.5
  kd: 0.1

# Used starting Phase 5 (AI controller)
ai:
  model: claude-sonnet-5
  history_window_ticks: 20
  max_response_wait_s: 10   # dead-man timer, doc §3.6

# Used starting Phase 3 (sensor fault injection)
sensor:
  noise_sigma_k: 0.15
  seeded_scenarios:
    - name: clean_late_drift
      seed: 1001
    - name: early_stuck_with_noise
      seed: 1002
    - name: spike_burst_on_setpoint_change
      seed: 1003
